<style>
  .evi-shadow { animation: evi-shadow 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .evi-float { animation: evi-float 4s ease-in-out infinite; }
  .evi-blink { animation: evi-blink 5s infinite; transform-box: fill-box; transform-origin: center; }
  .evi-document { animation: evi-wave 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes evi-float { 50% { transform: translateY(-8px); } }
  @keyframes evi-shadow { 50% { transform: scale(.88); opacity: .6; } }
  @keyframes evi-blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes evi-wave { 50% { transform: rotate(-7deg); } }
  @media (prefers-reduced-motion: reduce) {
    .evi-float, .evi-shadow, .evi-blink, .evi-document { animation: none; }
  }
</style>
