<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 0 220 220" role="img" aria-label="Evi armando tu práctica"><title>Evi armando tu práctica</title><style>.evi-bob{animation:evi-bob 1.8s ease-in-out infinite alternate;transform-origin:105px 205px}@keyframes evi-bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-5px) rotate(1deg)}}.evi-pencil{animation:evi-wr .7s ease-in-out infinite alternate;transform-origin:184px 158px}@keyframes evi-wr{from{transform:rotate(-9deg)}to{transform:rotate(7deg)}}.evi-blink{animation:evi-blink 4s infinite;transform-box:fill-box;transform-origin:center}@keyframes evi-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}.evi-line{stroke-dasharray:100;animation:evi-line 2.6s ease-in-out infinite}@keyframes evi-line{0%{stroke-dashoffset:100;opacity:0}6%{opacity:1}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}.evi-spark{transform-box:fill-box;transform-origin:center;animation:evi-spark 2s ease-in-out infinite}@keyframes evi-spark{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}@media(prefers-reduced-motion:reduce){.evi-bob,.evi-pencil,.evi-blink,.evi-line,.evi-spark{animation:none!important}}</style><ellipse cx="105" cy="210" rx="56" ry="7" fill="#1B1B3A" opacity=".14"/><g class="evi-bob"><path d="M84 200 V212 M126 200 V212" stroke="#1B1B3A" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M38 132 Q22 138 20 154" stroke="#1B1B3A" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="20" cy="159" r="9" fill="#fff" stroke="#1B1B3A" stroke-width="5"/><path d="M172 130 Q182 140 184 150" stroke="#1B1B3A" stroke-width="5" fill="none"/><g class="evi-pencil"><polygon points="179.6,177.8 172.4,174.2 169.3,180.5 176.5,184.1" fill="#FF8A7A" stroke="#1B1B3A" stroke-width="3"/><polygon points="179.6,177.8 172.4,174.2 192.1,134.9 199.3,138.5" fill="#FFC933" stroke="#1B1B3A" stroke-width="3"/><polygon points="192.1,134.9 199.3,1