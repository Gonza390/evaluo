name: Progreso responsive QA

on:
  push:
    branches: [main]
    paths:
      - 'components/dashboard/pdf-progress-panel.tsx'
      - 'components/dashboard/study-error-detail.tsx'
      - 'components/student-material-exam.tsx'
      - 'components/student-material-flashcards.tsx'
      - 'components/material-study-workspace.tsx'
      - 'scripts/qa-progreso-responsive.mjs'
      - '.github/workflows/progreso-responsive-qa.yml'
  pull_request:
    paths:
      - 'components/dashboard/pdf-progress-panel.tsx'
      - 'components/material-study-workspace.tsx'
      - 'scripts/qa-progreso-responsive.mjs'
      - '.github/workflows/progreso-responsive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install pinned QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated app preview
        run: |
          npm run dev -- --port 3100 > /tmp/evaluo-qa-next.log 2>&1 &
          echo $! > /tmp/evaluo-qa-next.pid
          for i in $(seq 1 90); do
            if curl --silent --fail 'http://localhost:3100/preview/progreso-pdf?tab=progreso&nuevo=1' -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -120 /tmp/evaluo-qa-next.log
          exit 1
      - name: Browser navigation, responsive and practice checks
        run: node scripts/qa-progreso-responsive.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progreso-responsive-qa
          path: qa-artifacts/progreso/
          if-no-files-found: ignore
          retention-days: 7
      - name: Print server errors if checks fail
        if: failure()
        run: tail -180 /tmp/evaluo-qa-next.log || true
