name: Study UX responsive QA

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'scripts/qa-study-responsive.mjs'
      - '.github/workflows/study-ux-responsive-qa.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'scripts/qa-study-responsive.mjs'
      - '.github/workflows/study-ux-responsive-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    name: Mobile and desktop study flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'
      QA_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install QA browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run dev -- --port 3100 > /tmp/evaluo-study-qa-next.log 2>&1 &
          echo $! > /tmp/evaluo-study-qa-next.pid
          for i in $(seq 1 90); do
            if curl --silent --fail 'http://localhost:3100/preview/progreso-pdf' -o /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -120 /tmp/evaluo-study-qa-next.log
          exit 1
      - name: Verify screen widths, navigation, no overflow, and Flashcards flipping
        run: node scripts/qa-study-responsive.mjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-ux-responsive-qa
          path: qa-artifacts/study-responsive/
          if-no-files-found: ignore
          retention-days: 14
      - name: Print server diagnostics on failure
        if: failure()
        run: tail -140 /tmp/evaluo-study-qa-next.log || true
