name: Temporary PDF viewer bottom clipping fix

on:
  push:
    branches:
      - fix/pdf-viewer-bottom-clipping-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-viewer-bottom-clipping-20260901
          fetch-depth: 0

      - name: Patch PDF viewer layout
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('components/PdfViewer.tsx'): [
                  (
                      "'surface-panel w-full min-w-0 max-w-full overflow-hidden'",
                      "'surface-panel flex w-full min-w-0 max-w-full flex-col overflow-hidden'",
                  ),
                  (
                      "'border-b border-slate-200 bg-white px-3 py-3 md:px-4'",
                      "'shrink-0 border-b border-slate-200 bg-white px-3 py-3 md:px-4'",
                  ),
                  (
                      "<div className={cn('grid gap-0', showSidebarThumbnails ? 'lg:grid-cols-[170px_minmax(0,1fr)]' : 'grid-cols-1')}>",
                      "<div className={cn('grid min-h-0 flex-1 gap-0', showSidebarThumbnails ? 'lg:grid-cols-[170px_minmax(0,1fr)]' : 'grid-cols-1')}>",
                  ),
                  (
                      "<div className={cn('bg-white p-2 sm:p-3', isStudyTheme && 'bg-[#17181C]')}>",
                      "<div className={cn('h-full min-h-0 bg-white p-2 sm:p-3', isStudyTheme && 'bg-[#17181C]')}>",
                  ),
              ],
              Path('components/material-study-workspace.tsx'): [
                  (
                      'heightClassName="h-[calc(100vh-14.8rem)] min-h-[620px]"',
                      'heightClassName="h-full min-h-0"',
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Remove temporary workflow and commit fix
        run: |
          git rm .github/workflows/tmp-fix-pdf-viewer-bottom-clipping.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/PdfViewer.tsx components/material-study-workspace.tsx
          git commit -m "Fix PDF viewer bottom clipping"
          git push origin HEAD:fix/pdf-viewer-bottom-clipping-20260901
