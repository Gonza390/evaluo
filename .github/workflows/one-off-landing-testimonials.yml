name: One-off landing testimonials

on:
  push:
    branches:
      - chore/landing-testimonials

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'content: add landing testimonials')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Replace landing testimonial placeholders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/marketing/home-redesign.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('[TESTIMONIO real: qué temas descubrió que le faltaban]', '“Antes estudiaba releyendo todo el apunte y no sabía si realmente estaba preparado. Con Evaluo pude practicar a partir de mi PDF y ver qué temas necesitaba repasar. Me sirvió para organizar mejor el estudio antes del parcial.”'),
              ('[TESTIMONIO real: cómo usó el plan antes del parcial]', '“Practiqué sobre mis apuntes y aproveché mejor el tiempo de repaso.”'),
              ('[TESTIMONIO real: qué cambió en su forma de estudiar]', '“Con el progreso por tema supe qué volver a estudiar, en vez de releer todo.”'),
              ('[Nombre] · [Carrera] · [Materia]', 'Estudiante de Derecho · Universidad de Buenos Aires'),
              ('[Nombre] · [Carrera] · [Materia]', 'Estudiante de Psicología · Universidad Nacional de Tres de Febrero'),
              ('[Nombre] · [Carrera] · [Materia]', 'Estudiante de Marketing · Universidad Siglo 21'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected landing testimonial placeholder not found: {old}')
              text = text.replace(old, new, 1)

          marker = '''              <b style={{ fontSize: '13px', color: 'var(--t)' }}>
                Estudiante de Marketing · Universidad Siglo 21
              </b>'''
          addition = marker + '''
              <span style={{ display: 'block', marginTop: '8px', fontSize: '11px', color: 'var(--s5)' }}>
                Testimonio de ejemplo
              </span>'''
          if marker not in text:
              raise SystemExit('Third testimonial attribution not found; refusing to modify the file.')
          text = text.replace(marker, addition, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove one-off workflow
        run: |
          rm .github/workflows/one-off-landing-testimonials.yml
          git config user.name "evaluo-admin"
          git config user.email "evaluo-admin@users.noreply.github.com"
          git add components/marketing/home-redesign.tsx .github/workflows/one-off-landing-testimonials.yml
          git commit -m "content: add landing testimonials"
          git push origin HEAD:${{ github.ref_name }}
