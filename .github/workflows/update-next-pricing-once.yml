name: Patch Next.js for Pricing (one-time)

on:
  push:
    branches:
      - feature/pricing-evaluo-2-0-oct22
    paths:
      - .github/workflows/update-next-pricing-once.yml

permissions:
  contents: write

jobs:
  patch-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Next.js and the dependency lockfile
        run: npm install next@16.4.2 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit patched package files
        run: |
          set -euo pipefail
          test "$(node -p "require('./package-lock.json').packages['node_modules/next'].version")" = "16.4.2"
          test "$(node -p "require('./package.json').dependencies.next")" = "16.4.2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Already patched"
          else
            git commit -m "fix(security): patch Next.js 16.4.2 and lockfile"
            git push origin HEAD:feature/pricing-evaluo-2-0-oct22
          fi
