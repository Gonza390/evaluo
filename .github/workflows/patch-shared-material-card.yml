name: Wire shared PDF material card

on:
  push:
    branches:
      - feat/pdf-material-card-production

permissions:
  contents: write

jobs:
  patch-materia-view:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-material-card-production
          fetch-depth: 0

      - name: Replace shared material card markup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/explorar/materia/[id]/materia-content.tsx')
          source = path.read_text(encoding='utf-8')

          import_anchor = "import { PdfCardThumbnail } from '@/components/materia/pdf-card-thumbnail';\n"
          import_line = "import { SharedStudentMaterialCard } from '@/components/materia/shared-student-material-card';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('PdfCardThumbnail import anchor not found')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          new = '''                <div className="grid gap-4 xl:grid-cols-2">
                  {sharedStudentMaterials.map((material) => (
                    <SharedStudentMaterialCard
                      key={material.id}
                      material={material}
                      href={getStudentMaterialRoute(material.id)}
                      materiaNombre={nombre}
                    />
                  ))}
                </div>'''

          if new not in source:
              pattern = re.compile(
                  r'\s*<div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">'
                  r'.*?Abrir PDF\s*</Link>\s*</div>\s*</article>\s*\)\)\}\s*</div>',
                  re.DOTALL,
              )
              source, count = pattern.subn('\n' + new, source, count=1)
              if count != 1:
                  raise SystemExit(f'Shared student material block replacement count: {count}')

          if source.count('Globe') == 1:
              source = source.replace('  Globe,\n', '')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Commit patched view
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/explorar/materia/[id]/materia-content.tsx'
          git commit -m "feat: show rich cards for shared student PDFs"
          git push origin HEAD:feat/pdf-material-card-production
