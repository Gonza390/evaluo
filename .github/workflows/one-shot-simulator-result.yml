name: One-shot simulator result integration

on:
  push:
    branches:
      - feat/simulator-result-redesign-20260829
    paths:
      - .github/workflows/one-shot-simulator-result.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simulator-result-redesign-20260829
          fetch-depth: 0

      - name: Integrate redesigned result screen
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('components/simulador/SimuladorExamen.tsx')
          source = path.read_text()

          import_line = "import { SimulatorFinishedResult } from '@/components/simulador/SimulatorFinishedResult';\n"
          import_anchor = "import { SimulatorPremiumUpsell } from '@/components/simulador/SimulatorPremiumUpsell';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('Import anchor not found')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          state_anchor = "  const [aciertosFinales, setAciertosFinales] = useState(0);\n"
          state_line = "  const [finalAttemptId, setFinalAttemptId] = useState<string | null>(null);\n"
          if state_line not in source:
              if state_anchor not in source:
                  raise SystemExit('State anchor not found')
              source = source.replace(state_anchor, state_anchor + state_line, 1)

          finish_anchor = "      setIsFinishing(true);\n      setShowResultsFace(false);\n"
          finish_replacement = "      setIsFinishing(true);\n      setFinalAttemptId(null);\n      setShowResultsFace(false);\n"
          if finish_replacement not in source:
              if finish_anchor not in source:
                  raise SystemExit('Finish anchor not found')
              source = source.replace(finish_anchor, finish_replacement, 1)

          success_anchor = "      if (response.success) {\n        setAciertosFinales(response.summary.respuestas_correctas);\n"
          success_replacement = "      if (response.success) {\n        setFinalAttemptId(response.attemptId);\n        setAciertosFinales(response.summary.respuestas_correctas);\n"
          if success_replacement not in source:
              if success_anchor not in source:
                  raise SystemExit('Success anchor not found')
              source = source.replace(success_anchor, success_replacement, 1)

          start_marker = "  if (estado === 'finished') {\n"
          end_marker = "  const accessibleQuestionCount = resolvedDemoMode\n"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Finished result block markers not found')

          new_block = """  if (estado === 'finished') {
    const totalPreguntasExamen = Math.max(1, preguntasDisponibles || questionLimit);
    const resolvedParcial = resolveExamParcial(parcial, preguntas);

    return (
      <SimulatorFinishedResult
        materiaId={materiaId}
        materiaNombre={materiaNombre}
        parcial={resolvedParcial}
        carreraId={carreraId}
        universidadId={universidadId}
        userId={userId}
        attemptId={finalAttemptId}
        mode={mode}
        aciertos={aciertosFinales}
        respondidas={respondidasFinales}
        totalPreguntas={totalPreguntasExamen}
        isFinishing={isFinishing}
        onNewExam={reiniciarSimulador}
      />
    );
  }

"""
          source = source[:start] + new_block + source[end:]
          path.write_text(source)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "Evaluo automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-simulator-result.yml
          git add components/simulador/SimuladorExamen.tsx components/simulador/SimulatorFinishedResult.tsx
          git commit -m "feat: use redesigned simulator result after finish"
          git push origin HEAD:feat/simulator-result-redesign-20260829
