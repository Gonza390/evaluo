name: CI

on:
  push:
    branches:
      - main
      - master
      - 'codex/**'
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Performance budget
        run: npm run performance:budget

# Nota: el repositorio todavía no contiene un baseline inicial reproducible de
# Supabase. Las migraciones históricas más antiguas asumen tablas preexistentes
# (por ejemplo public.profiles), por lo que `supabase db reset` desde una DB vacía
# produce un falso negativo antes de llegar a las migraciones actuales. Cuando se
# incorpore el baseline, el replay completo debe volver a activarse como job de CI.
