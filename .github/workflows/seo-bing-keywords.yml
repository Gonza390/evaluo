name: SEO Bing keyword API smoke (master only)

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/seo-bing-keywords.yml'
      - 'scripts/seo/bing-keyword-research.mjs'
      - 'scripts/seo/bing-batch-research.mjs'
      - 'tests/seo-bing-keyword.smoke.mjs'
      - 'tests/seo-bing-batch.smoke.mjs'
      - 'seo/keyword-data/bing-requests.json'
      - 'scripts/seo/editorial-quality-gate.mjs'
      - 'tests/seo-editorial-quality-gate.smoke.mjs'
      - 'seo/keyword-data/EDITORIAL_POLICY.md'

permissions:
  contents: write

concurrency:
  group: seo-bing-smoke-master
  cancel-in-progress: false

jobs:
  keyword-smoke:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit smoke tests (synthetic data, no credentials)
        run: |
          node tests/seo-bing-keyword.smoke.mjs
          node tests/seo-bing-batch.smoke.mjs
          node tests/seo-editorial-quality-gate.smoke.mjs

      - name: Verify secret is configured
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          if [ -z "$BING_WEBMASTER_API_KEY" ]; then
            echo "::error title=Bing API secret missing::Set BING_WEBMASTER_API_KEY in repository Actions secrets."
            exit 1
          fi
          echo "Bing API secret is present; its value is never logged."

      - name: Query Bing Webmaster API
        id: bingquery
        env:
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          node scripts/seo/bing-batch-research.mjs \
            --file=seo/keyword-data/bing-requests.json \
            --out=artifacts/seo/bing-latest.json

      - name: Upload sanitized JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-bing-keyword-research
          path: artifacts/seo/bing-latest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist sanitized result in master for SEO tasks
        if: steps.bingquery.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B seo-bing-sync origin/master
            mkdir -p seo/keyword-data
            cp artifacts/seo/bing-latest.json seo/keyword-data/bing-latest.json
            git add seo/keyword-data/bing-latest.json
            if git diff --cached --quiet; then
              echo "Identical Bing report already saved."
              exit 0
            fi
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(seo): store Bing-only keyword observations [skip ci]"
            if git push origin HEAD:master; then
              echo "Saved sanitized Bing data in master."
              exit 0
            fi
            echo "Concurrent master update, retrying ($attempt/3)."
          done
          echo "::error::Unable to save keyword observations after 3 attempts."
          exit 1

      - name: Validate real API responses
        if: steps.bingquery.outcome == 'success'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('artifacts/seo/bing-latest.json', 'utf8'));
          if (!Array.isArray(report.results) || report.results.length < 1) throw Error('No keyword rows');
          if (report.results.some((r) => r.googleMonthlyVolume !== null || r.eligibleForGoogle500Rule !== false)) {
            throw Error('Bing data erroneously promotes Google search volumes');
          }
          if (!report.successfulApiCalls) throw Error('Bing API did not return any successful responses; review sanitized per-keyword errors');
          console.log('Bing API responses:', report.successfulApiCalls, 'successful,', report.errorCount, 'failed');
          NODE
