name: Run queued PDF worker once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/run-pdf-worker-once.yml'
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Process next queued PDF
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          status=$(curl --silent --show-error --max-time 330 \
            --output /tmp/worker-response.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://evaluo.com.ar/api/internal/student-material-jobs)

          cat /tmp/worker-response.json
          echo
          echo "HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
